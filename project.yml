name: Downloader

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true

packages:
  DownloadKit:
    path: DownloadKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Local builds are ad-hoc signed. Set DEVELOPMENT_TEAM and a Developer ID identity to distribute.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # User-facing strings live in String Catalogs (App/Resources/Localizable.xcstrings); the compiler emits the
    # strings it finds so `xcstringstool sync` can add new ones to the catalog.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Downloader:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: DownloadKit
        product: DownloadKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Downloader
        CFBundleDevelopmentRegion: en
        # The app's languages; add a language here and translate it in the String Catalogs.
        CFBundleLocalizations: [en, tr]
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: ""
        # A download manager has to fetch plain http:// links.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [downloader]
        # Lets text files of links be dropped on the Dock icon or opened with the app.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Text Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
        # "Add to Downloader" in the Services menu: macOS cannot deliver text dropped on a Dock icon.
        NSServices:
          - NSMenuItem:
              default: Add to Downloader
            NSMessage: addDownloads
            NSPortName: Downloader
            NSSendTypes: [NSStringPboardType, public.utf8-plain-text]
    entitlements:
      path: App/Downloader.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Downloader
        PRODUCT_NAME: Downloader
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES

  DownloaderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: Downloader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DownloaderTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Downloader.app/Contents/MacOS/Downloader"

schemes:
  Downloader:
    build:
      targets:
        Downloader: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DownloaderTests
