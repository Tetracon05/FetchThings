name: FetchThings

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true

packages:
  DownloadKit:
    path: DownloadKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Local builds are ad-hoc signed. Set DEVELOPMENT_TEAM and a Developer ID identity to distribute.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # User-facing strings live in String Catalogs (App/Resources/Localizable.xcstrings); the compiler emits the
    # strings it finds so `xcstringstool sync` can add new ones to the catalog.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  FetchThings:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      # The app icon: an Icon Composer document (layers + Liquid Glass), edited with Icon Composer. Xcode compiles it into
      # the asset catalog and, because the deployment target is below macOS 26, into a flat icns for the older systems.
      - path: FetchThings.icon
    dependencies:
      - package: DownloadKit
        product: DownloadKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FetchThings
        CFBundleDevelopmentRegion: en
        # The app's languages; add a language here and translate it in the String Catalogs.
        CFBundleLocalizations: [en, tr]
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: ""
        # A download manager has to fetch plain http:// links.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [fetchthings]
        # The type a drag that starts in this app carries (`OwnDrag`), so the window can refuse it when it is dropped back
        # on itself. Built from the bundle id, like `OwnDrag.identifier`, so a real id needs no change here.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER).internal-drag
            UTTypeDescription: A drag that started in the app
            UTTypeConformsTo: [public.data]
        # Lets text files of links be dropped on the Dock icon or opened with the app.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Text Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
        # "Add to FetchThings" in the Services menu: macOS cannot deliver text dropped on a Dock icon.
        NSServices:
          - NSMenuItem:
              default: Add to FetchThings
            NSMessage: addDownloads
            NSPortName: FetchThings
            NSSendTypes: [NSStringPboardType, public.utf8-plain-text]
    entitlements:
      path: App/FetchThings.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.FetchThings
        PRODUCT_NAME: FetchThings
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: FetchThings
        COMBINE_HIDPI_IMAGES: YES

  FetchThingsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: FetchThings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.FetchThingsTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FetchThings.app/Contents/MacOS/FetchThings"

schemes:
  FetchThings:
    build:
      targets:
        FetchThings: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FetchThingsTests
